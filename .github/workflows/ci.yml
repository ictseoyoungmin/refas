name: RefAs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install portable renderer dependencies
        run: python -m pip install --requirement requirements.txt
      - name: JavaScript regression tests
        run: npm test
      - name: Python syntax gate
        run: npm run test:python
      - name: Product-boundary audit
        run: npm run check
      - name: Complete dogfood
        if: matrix.node == 24
        run: npm run dogfood
      - name: Release audit
        if: matrix.node == 24
        run: npm run release:audit
