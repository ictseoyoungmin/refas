name: Publish verified release

# Exact-SHA manual PUBLISH is the sole release authorization.
# Keep workflow_run event for trigger compatibility but SKIP publication jobs
# on every automated run. The consumed v1.4.1 marker grants no authority.
# Exact current main SHA and all 17 full QA gates remain mandatory.
on:
  workflow_run:
    workflows: ["RefAs CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH to approve public release'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: refas-publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact main SHA and post-merge full CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node <<'NODE'
          const sha=process.env.RELEASE_SHA;
          const repo=process.env.GITHUB_REPOSITORY;
          const base=process.env.GITHUB_API_URL||'https://api.github.com';
          const token=process.env.GITHUB_TOKEN;
          if(!/^[0-9a-f]{40}$/.test(sha||''))throw new Error('invalid exact release_sha');
          async function get(url) {
            const response=await fetch(`${base}/repos/${repo}${url}`,{
              headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'},
            });
            if(!response.ok)throw new Error(`preflight ${url}: HTTP ${response.status}`);
            return response.json();
          }
          const main=await get('/git/ref/heads/main');
          if(main.object?.type!=='commit'||main.object?.sha!==sha)
            throw new Error('release_sha is not the current main HEAD');
          const result=await get('/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100');
          const matching=(result.workflow_runs||[]).filter(run=>run.head_sha===sha&&
            run.head_branch==='main'&&run.event==='push'&&run.status==='completed'&&run.conclusion==='success');
          if(!matching.length)throw new Error('successful exact main push CI is missing');
          let certified=false;
          for(const run of matching){
            const batch=await get(`/actions/runs/${run.id}/jobs?per_page=100`);
            const jobs=batch.jobs||[];
            if(!['Node 20','Node 22','Node 24'].every(name=>
              jobs.some(job=>job.name===name&&job.conclusion==='success')))continue;
            const node24=jobs.find(job=>job.name==='Node 24'&&job.conclusion==='success');
            // These are exact named steps in ci.yml; a removed/renamed gate fails closed.
            const fullQaSteps=[
              'First neutral-clay multiview operational baseline',
              'External construction fresh-worker dogfood',
              'Subdivision cage organic dogfood',
              'Bilateral pair fresh-worker dogfood',
              'Structural plausibility fresh-worker dogfood',
              'Competing blockout fresh-worker dogfood',
              'Prior quarantine fresh-worker dogfood',
              'Discovery closure verifier',
              'VC00 volume-closure regression fixtures',
              'Joint parameter-fit dogfood',
              'Independent PBR material dogfood',
              'Textured material dogfood',
              'Hard-surface topology dogfood',
              'Modular assembly contact dogfood',
              'Release audit',
              'Verify actual npm package installation',
              'Verify saved v1.2.1 project upgrade',
            ];
            if(fullQaSteps.every(name=>
              node24.steps?.some(step=>step.name===name&&step.conclusion==='success'))){
              certified=true; console.log(`verified ${sha} by main CI run ${run.id}`);break;
            }
          }
          if(!certified)throw new Error('exact main CI lacks complete dogfood/release audit');
          NODE

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            throw new Error(`package.json contains unsupported semantic version: ${pkg.version}`);
          }
          console.log(`version=${pkg.version}`);
          console.log(`tag=v${pkg.version}`);
          NODE

      - name: Publish or verify GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const apiBase = process.env.GITHUB_API_URL || 'https://api.github.com';
          const sha = process.env.RELEASE_SHA;
          const tag = process.env.RELEASE_TAG;
          const version = process.env.RELEASE_VERSION;
          if (!token || !repo || !sha || !tag || !version) throw new Error('release environment is incomplete');

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };

          async function request(path, options = {}) {
            const response = await fetch(`${apiBase}/repos/${repo}${path}`, {
              ...options,
              headers: {...headers, ...(options.headers || {})},
            });
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            return {response, body};
          }

          function extractReleaseNotes(changelog) {
            const lines = changelog.split('\n').map((line) => line.endsWith('\r') ? line.slice(0, -1) : line);
            const headingPrefix = `## ${version}`;
            const start = lines.findIndex((line) => line === headingPrefix || line.startsWith(`${headingPrefix} `));
            if (start < 0) throw new Error(`CHANGELOG.md has no section for ${version}`);
            let end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
            if (end < 0) end = lines.length;
            const notes = lines.slice(start + 1, end).join('\n').trim();
            if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty`);
            return notes;
          }

          function desiredRelease(notes) {
            return {
              name: `RefAs ${tag}`,
              body: notes,
              draft: false,
              prerelease: version.includes('-'),
            };
          }

          async function readTagRef() {
            const {response, body} = await request(`/git/ref/tags/${encodeURIComponent(tag)}`);
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`unable to read ${tag}: ${response.status} ${JSON.stringify(body)}`);
            return body;
          }

          async function readTextFileAtRef(filePath, ref) {
            const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
            const {response, body} = await request(`/contents/${encodedPath}?ref=${encodeURIComponent(ref)}`);
            if (!response.ok) {
              throw new Error(`unable to read ${filePath} at ${ref}: ${response.status} ${JSON.stringify(body)}`);
            }
            if (body?.type !== 'file' || body?.encoding !== 'base64' || typeof body?.content !== 'string') {
              throw new Error(`${filePath} at ${ref} is not a base64 GitHub file response`);
            }
            return Buffer.from(body.content, 'base64').toString('utf8');
          }

          function verifyReleaseMetadata(release, releaseSha, desired) {
            if (release.target_commitish !== releaseSha) {
              throw new Error(`${tag} release target ${release.target_commitish} does not match tag commit ${releaseSha}`);
            }
            for (const [key, expected] of Object.entries(desired)) {
              if (release[key] !== expected) {
                throw new Error(`${tag} release ${key} mismatch after publication repair`);
              }
            }
          }

          const existingRef = await readTagRef();
          if (existingRef) {
            if (existingRef.object?.type !== 'commit') {
              throw new Error(`${tag} exists but is not a lightweight commit tag`);
            }

            const releaseSha = existingRef.object.sha;
            const taggedPackage = JSON.parse(await readTextFileAtRef('package.json', releaseSha));
            if (taggedPackage.version !== version) {
              throw new Error(`${tag} points to package version ${taggedPackage.version}, expected ${version}`);
            }
            const notes = extractReleaseNotes(await readTextFileAtRef('CHANGELOG.md', releaseSha));
            const desired = desiredRelease(notes);

            const {response, body: release} = await request(`/releases/tags/${encodeURIComponent(tag)}`);
            if (!response.ok) {
              throw new Error(`${tag} exists without a readable GitHub Release: ${response.status} ${JSON.stringify(release)}`);
            }
            if (release.target_commitish !== releaseSha) {
              throw new Error(`${tag} release target ${release.target_commitish} does not match tag commit ${releaseSha}`);
            }

            // Tagged release records stay immutable; manual intervention is
            // required to reconcile a partial or conflicting publication.
            for (const [key, expected] of Object.entries(desired)) {
              if (release[key] !== expected)
                throw new Error(`${tag} metadata conflict in ${key}; manual reconciliation required`);
            }

            const {response: verifyResponse, body: verifiedRelease} = await request(`/releases/tags/${encodeURIComponent(tag)}`);
            if (!verifyResponse.ok) {
              throw new Error(`unable to re-read ${tag} release: ${verifyResponse.status} ${JSON.stringify(verifiedRelease)}`);
            }
            verifyReleaseMetadata(verifiedRelease, releaseSha, desired);
            console.log(`${tag} remains immutable at ${releaseSha}; release metadata verified from the tagged source snapshot`);
            process.exit(0);
          }

          const notes = extractReleaseNotes(fs.readFileSync('CHANGELOG.md', 'utf8'));
          const desired = desiredRelease(notes);
          const {response, body} = await request('/releases', {
            method: 'POST',
            body: JSON.stringify({
              tag_name: tag,
              target_commitish: sha,
              ...desired,
              make_latest: version.includes('-') ? 'false' : 'true',
            }),
          });
          if (!response.ok) throw new Error(`release creation failed: ${response.status} ${JSON.stringify(body)}`);

          const createdRef = await readTagRef();
          if (!createdRef || createdRef.object?.type !== 'commit' || createdRef.object?.sha !== sha) {
            throw new Error(`${tag} was created but does not resolve to verified commit ${sha}`);
          }
          const {response: verifyResponse, body: verifiedRelease} = await request(`/releases/tags/${encodeURIComponent(tag)}`);
          if (!verifyResponse.ok) {
            throw new Error(`unable to verify created ${tag} release: ${verifyResponse.status} ${JSON.stringify(verifiedRelease)}`);
          }
          verifyReleaseMetadata(verifiedRelease, sha, desired);
          console.log(`published ${tag} at ${sha}: ${body.html_url}`);
          NODE
