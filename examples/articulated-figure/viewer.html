<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articulated figure pose viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>:root{color-scheme:dark;font:15px/1.45 system-ui;background:#0d1117;color:#eef1f4}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid #29313a}h1{margin:0 auto 0 0;font-size:16px}button{border:1px solid #47515c;border-radius:999px;padding:8px 14px;background:#171d24;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#d6aa72;color:#24180d}model-viewer{width:100%;height:100%;min-height:620px;background:radial-gradient(circle at 50% 38%,#29313a,#0d1117 68%)}</style></head>
<body><header><h1>Articulated figure — exact generated GLB</h1><button id="reference" aria-pressed="true">Reference pose</button><button id="neutral" aria-pressed="false">Neutral pose</button></header>
<model-viewer id="viewer" src="output/project/assets/articulated-figure.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" alt="Articulated wooden drawing mannequin"></model-viewer>
<script>const viewer=document.querySelector('#viewer'),buttons=[...document.querySelectorAll('button')],poses={reference:'output/project/assets/articulated-figure.glb',neutral:'output/project/assets/articulated-figure-neutral.glb'};for(const button of buttons)button.addEventListener('click',()=>{viewer.src=poses[button.id];for(const candidate of buttons)candidate.setAttribute('aria-pressed',String(candidate===button))})</script></body></html>
