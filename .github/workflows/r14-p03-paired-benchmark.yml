name: R14-P03 Paired RefAs CPU Release Benchmark (isolated)

# Experimental benchmark. Two revisions run serially on ONE physical runner.
# Explicit marker branches only; never part of ordinary release CI.
on:
  push:
    branches:
      - 'bench/r14-p03-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refas-r14-p03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-same-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NUMBA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.4.0
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Install identical pinned CPU dependencies
        run: |
          python -m pip install --requirement candidate/requirements.txt
          python -m pip install --no-cache-dir numba==0.65.1
          mkdir -p artifacts
      - name: Measure v1.4.0 on this runner
        run: |
          python baseline/skills/refas/scripts/benchmark_render_cpu_warm.py \
            --triangles 100000,500000,1000000 \
            --matrix-count 500000 --case strands --seed 12345 \
            --size 160 --baseline-tile 32 --baseline-threads 4 \
            --thread-matrix 4 --tile-matrix 32 --repeats 3 \
            --max-working-mb 1024 --out artifacts/baseline-v140.json
      - name: Measure exact candidate on the SAME runner
        run: |
          python candidate/skills/refas/scripts/benchmark_render_cpu_warm.py \
            --triangles 100000,500000,1000000 \
            --matrix-count 500000 --case strands --seed 12345 \
            --size 160 --baseline-tile 32 --baseline-threads 4 \
            --thread-matrix 4 --tile-matrix 32 --repeats 3 \
            --max-working-mb 1024 --out artifacts/candidate-v141.json
      - name: Verify both reports and compare only matched workloads
        run: |
          python - <<'PY'
          import json, math, os, statistics
          from pathlib import Path
          base=json.loads(Path('artifacts/baseline-v140.json').read_text())
          cand=json.loads(Path('artifacts/candidate-v141.json').read_text())
          assert base['status']==cand['status']=='COMPLETE'
          assert base['claimScope']==cand['claimScope']=='measurement-only'
          assert base['certificationEligible'] is cand['certificationEligible'] is False
          assert base['parameters']==cand['parameters']
          for key in ('cpuModel','python','numpy','numba','logicalCpus'):
              assert base['environment'][key]==cand['environment'][key],key
          rows=[]
          for old,new in zip(base['tiers'],cand['tiers']):
              assert old['sourceTriangles']==new['sourceTriangles']
              assert old['assetGlbSha256']==new['assetGlbSha256']
              assert old['frameSha256']==new['frameSha256']
              assert old['referenceDigests']==new['referenceDigests']
              assert old['parity']==new['parity']=='EXACT'
              prior=[s['totalPassMs'] for s in old['baseline']['samples']]
              current=[s['totalPassMs'] for s in new['baseline']['samples']]
              assert len(prior)==len(current)==3
              oldmedian=statistics.median(prior)
              newmedian=statistics.median(current)
              rows.append({'triangles':old['sourceTriangles'],
                           'glbSha256':old['assetGlbSha256'],
                           'frameSha256':old['frameSha256'],
                           'baselineSamplesMs':prior,'candidateSamplesMs':current,
                           'baselineMedianMs':oldmedian,'candidateMedianMs':newmedian,
                           'candidateOverBaseline':round(newmedian/oldmedian,6),
                           'outputParity':'EXACT'})
          result={'schema':'refas.r14-p03-same-runner-release-compare/v1',
                  'status':'COMPLETE','claimScope':'measurement-only',
                  'certificationEligible':False,'baselineRef':'v1.4.0',
                  'candidateCommitSha':os.environ['GITHUB_SHA'],
                  'cpuModel':base['environment']['cpuModel'],
                  'environment':base['environment'],'tiers':rows,
                  'limitations':['Two serial process runs on one runner, not simultaneous CPUs.',
                     'Warm JIT after separate compilation; no cold startup speedup inference.',
                     'Synthetic positive-area GLB only; private Monster Bed not present.',
                     'Source-photo fidelity and actual CPU/Cycles photometric equivalence not tested.',
                     'Three repeats are descriptive; ratios are not proof of stable superiority.']}
          Path('artifacts/paired-comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'status':'COMPLETE','cpu':result['cpuModel'],'medians':rows}))
          PY
      - name: Upload paired source-pinned measurements (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-p03-paired-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
