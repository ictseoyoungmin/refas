name: RefAs CI

on:
  push:
    branches: [main, rewrite/v2, rc/post-1.1, develop/v1.2.0, develop/v1.2.1, develop/v1.3.0, develop/v1.4.0, develop/v1.4.1, develop/v1.4.2]
  pull_request:
    branches: [main, rewrite/v2, rc/post-1.1, develop/v1.2.0, develop/v1.2.1, develop/v1.3.0, develop/v1.4.0, develop/v1.4.1, develop/v1.4.2]

# Tier 1: full regression and critical source-bound defenses on every PR/develop push.
# Legacy JIT runs on main push or an explicit [full-qa] push, and in Deep QA.
# Tier 2: expensive complete dogfood on main push or an explicit [full-qa] develop push.
# A standalone manual/periodic deep workflow is also provided (ci-deep.yml).
concurrency:
  group: refas-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  artifact-budget:
    name: Source artifact budget
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          # Sparse checkout also enables blob:none fetching. Old model/render
          # payloads are neither checked out nor fetched by this source gate.
          sparse-checkout: |
            /package.json
            /tools/check-artifact-budget.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve the proposed range and inspect source payloads
        env:
          REFAS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          REFAS_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The same immutable policy boundary is enforced by the checker.
          anchor=ea64de8adfa787537bee2b86a05ac0f4ec08dd5c
          target=$(git rev-parse HEAD)
          base=${REFAS_PR_BASE:-$REFAS_PUSH_BEFORE}
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            # A newly created v2 branch must still pass the complete policy era.
            base=$anchor
          fi
          for revision in "$base" "$anchor"; do
            if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              git fetch --no-tags --filter=blob:none --depth=1 origin "$revision"
            fi
          done
          history_ready() {
            local common
            common=$(git merge-base "$base" "$target") || return 1
            # Later feature branches can use the ordinary strict diff without
            # fetching the entire history back to the original policy boundary.
            # The checker still requires ancestry proof for any legacy exemption.
            if git cat-file -e "$common:tools/check-artifact-budget.mjs" 2>/dev/null; then
              return 0
            fi
            if git merge-base --is-ancestor "$anchor" "$common"; then
              return 0
            fi
            if git merge-base --is-ancestor "$common" "$anchor" &&
               git merge-base --is-ancestor "$anchor" "$target"; then
              return 0
            fi
            [[ $(git rev-parse --is-shallow-repository) == false ]]
          }
          # Ordinary PRs/pushes already have the base parent at depth 2. The old
          # v2→main PR needs a short ancestry path through the legacy boundary.
          for depth in 16 64 256; do
            if history_ready; then break; fi
            git fetch --no-tags --filter=blob:none --depth="$depth" origin "$target" "$base" "$anchor"
          done
          if ! history_ready; then
            echo 'Cannot prove the artifact review range with the fetched history; inspection has not been bypassed.' >&2
            exit 1
          fi
          npm run check:artifacts -- --base "$base" --head "$target"

  validate:
    name: Node ${{ matrix.node }}
    needs: artifact-budget
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install portable renderer dependencies
        run: python -m pip install --requirement requirements.txt
      - name: JavaScript regression tests
        run: npm test
      - name: Python syntax gate
        run: npm run test:python
      - name: Product-boundary audit
        run: npm run check
      - name: Install optional Numba CPU prototype (Node 24 only)
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-qa]'))
        run: python -m pip install --no-cache-dir numba==0.65.1
      - name: Compiled CPU kernel tests
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-qa]'))
        run: |
          npm run test:cpu-jit
          node --test tests/render-backend.test.mjs
      - name: Package bytecode exclusion smoke
        if: matrix.node == 24
        run: |
          mkdir -p skills/refas/scripts/__pycache__
          printf 'must-not-ship' > skills/refas/scripts/__pycache__/refas_pack_probe.cpython-312.pyc
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/refas-packlist.json"
          node -e "const p=require(process.env.RUNNER_TEMP+'/refas-packlist.json'); const f=p[0].files.map(x=>x.path); if(f.some(x=>x.includes('__pycache__')||x.endsWith('.pyc'))) process.exit(2)"
          rm skills/refas/scripts/__pycache__/refas_pack_probe.cpython-312.pyc
      - name: Fresh-worker public-contract dogfood
        if: matrix.node == 24
        run: npm run dogfood:fresh-worker
      - name: First neutral-clay multiview operational baseline
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run benchmark:first-multiview
      - name: External construction fresh-worker dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:external-construction
      - name: Subdivision cage organic dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:subdivision-cage
      - name: Bilateral pair fresh-worker dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:bilateral-pair
      - name: Structural plausibility fresh-worker dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:structural-plausibility
      - name: Competing blockout fresh-worker dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:blockout-competition
      - name: Prior quarantine fresh-worker dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:prior-quarantine
      - name: Discovery closure verifier
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run check:discovery-closure
      - name: VC00 volume-closure regression fixtures
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:volume-regression
      - name: VC08 adversarial public-boundary dogfood
        if: matrix.node == 24
        run: npm run dogfood:adversarial
      - name: Joint parameter-fit dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:parameter-fit
      - name: Independent PBR material dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:pbr
      - name: Textured material dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:textured-material
      - name: Hard-surface topology dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:hard-surface
      - name: Modular assembly contact dogfood
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run dogfood:assembly
      - name: Release audit
        # Release/promotion deep validation only; reserve expensive scene tests for explicit deep validation.
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: npm run release:audit
      - name: Checkout published v1.2.1 for compatibility smoke
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        uses: actions/checkout@v7
        with:
          ref: v1.2.1
          path: .refas-v121-baseline
          persist-credentials: false
      - name: Verify actual npm package installation
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        run: node tools/verify-packed-install.mjs
      - name: Verify saved v1.2.1 project upgrade
        if: matrix.node == 24 && github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref == 'refs/heads/develop/v1.2.1' || github.ref == 'refs/heads/develop/v1.3.0' || github.ref == 'refs/heads/develop/v1.4.0' || (github.ref == 'refs/heads/develop/v1.4.1' || github.ref == 'refs/heads/develop/v1.4.2')) && contains(github.event.head_commit.message, '[full-qa]')))
        env:
          REFAS_V121_ROOT: ${{ github.workspace }}/.refas-v121-baseline
        run: node tools/verify-v121-upgrade.mjs
